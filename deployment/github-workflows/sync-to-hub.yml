name: Sync to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: false

jobs:
  sync:
    if: vars.HF_SPACE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          repo_type: space
          space_sdk: docker
          hf_token: ${{ secrets.HF_TOKEN }}