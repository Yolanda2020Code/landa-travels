    AdminReviewInput:
      type: object
      required: [sessionId, label]
      properties:
        eventId: { type: string }
        sessionId: { type: string }
        label: { type: string, maxLength: 80 }
        notes: { type: string, maxLength: 1000 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

