        mode: { type: string, enum: [skip, manual, gps] }
        label: { type: ["string", "null"] }
        checkedAt: { type: ["string", "null"], format: date-time }
        stale: { type: boolean }
        attribution: { type: ["string", "null"] }
        hotels: { type: array, items: { $ref: "#/components/schemas/NearbyMapItem" } }
        transit: { type: array, items: { $ref: "#/components/schemas/NearbyMapItem" } }
        attractions: { type: array, items: { $ref: "#/components/schemas/NearbyMapItem" } }
        notice: { type: string }
    OffsetProgrammeContext:
      type: object
      additionalProperties: false
      required: [status, source, checkedAt, notice, programmes]
      properties:
        status: { type: string, enum: [curated-demo] }
