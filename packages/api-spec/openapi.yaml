        events:
          type: array
          items: { $ref: "#/components/schemas/RewardEvent" }
    ContactInput:
      type: object
      required: [name, email, message, consent]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
