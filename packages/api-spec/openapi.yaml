        email: { type: string, format: email }
        details: { type: string }
        cvFileName: { type: string }
        cvSize: { type: integer }
        createdAt: { type: string, format: date-time }
        retentionExpiresAt: { type: string, format: date-time }
        cvDownloadUrl: { type: string, format: uri }
    AdminAnalyticsResponse:
      type: object
