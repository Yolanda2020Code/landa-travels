        name: { type: string }
        objectId: { type: string }
        sourceUrl: { type: string, format: uri }
        distanceKm: { type: number, minimum: 0 }
    NearbyMapContext:
      type: object
      additionalProperties: false
      required: [status, mode, label, checkedAt, stale, attribution, hotels, transit, attractions, notice]
