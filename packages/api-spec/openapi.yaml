        summary: { type: string }
        travellerReply: { type: ["string", "null"] }
        assignedAdvisorId: { type: ["string", "null"] }
        assignedAdvisorName: { type: ["string", "null"] }
        notificationStatus:
          type: string
          enum: [accepted, pending, failed, not_configured]
        createdAt: { type: string, format: date-time }
        assignedAt: { type: ["string", "null"], format: date-time }
        repliedAt: { type: ["string", "null"], format: date-time }
        closedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
