        destination: { type: ["string", "null"] }
        dateRange: { type: ["string", "null"] }
        travellerCount: { type: ["integer", "null"] }
        budget: { type: ["string", "null"] }
        transportPreferences: { type: array, items: { type: string } }
        accommodationNeeds: { type: array, items: { type: string } }
        activityPreferences: { type: array, items: { type: string } }
        sustainabilityPriority: { type: ["string", "null"] }
        stopovers: { type: array, items: { type: string } }
        accessibilityNeeds: { type: array, items: { type: string } }
        locationConsentMode: { type: ["string", "null"] }
        recommendationOptions:
