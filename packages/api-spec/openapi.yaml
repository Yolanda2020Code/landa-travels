          maxLength: 4000
    AdvisorHandoverContext:
      type: object
      required: [origin, destination, dateRange, travellerCount, budget, transportPreferences, accommodationNeeds, sustainabilityPriority, stopovers, accessibilityNeeds, locationConsentMode]
      properties:
