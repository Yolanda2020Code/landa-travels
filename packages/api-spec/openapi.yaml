        checkedAt: { type: "null" }
        notice: { type: string }
        programmes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, organization, sourceUrl, evidenceType, checkedAt, limitations]
            properties:
              id: { type: string }
              name: { type: string }
              organization: { type: string }
              sourceUrl: { type: string, format: uri }
              evidenceType: { type: string, enum: [official programme directory] }
              checkedAt: { type: "null" }
              limitations: { type: string }
    CertificationEvidence:
      type: object
      additionalProperties: false
      required: [scheme, licenceNumber, validUntil, checkedAt, registryUrl, hotelUrl, address]
      properties:
        scheme: { type: string }
        licenceNumber: { type: string }
        validUntil: { type: string, format: date }
        checkedAt: { type: string, format: date-time }
        registryUrl: { type: string, format: uri }
        hotelUrl: { type: ["string", "null"], format: uri }
        address: { type: string }
    CertifiedAccommodation:
      type: object
      additionalProperties: false
      required: [id, name, city, country, address, certificationEvidence]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        country: { type: string }
        address: { type: string }
        certificationEvidence: { $ref: "#/components/schemas/CertificationEvidence" }
    CertifiedStaysFeed:
      type: object
      additionalProperties: false
      required: [status, checkedAt, source, sourceUrl, attribution, notice, stays]
      properties:
        status: { type: string, enum: [available, unavailable, not-covered] }
        checkedAt: { type: ["string", "null"], format: date-time }
        source: { type: string }
        sourceUrl: { type: string, format: uri }
        attribution: { type: string }
        notice: { type: string }
        stays: { type: array, items: { $ref: "#/components/schemas/CertifiedAccommodation" } }
    TransitDeparture:
      type: object
      additionalProperties: false
      required: [stop, line, destination, departureAt, timing]
      properties:
        stop: { type: string }
        line: { type: string }
        destination: { type: string }
        departureAt: { type: string, format: date-time }
        timing: { type: string, enum: [scheduled, real-time] }
    CulturalEvent:
      type: object
      additionalProperties: false
      required: [title, startAt, venue, category, sourceUrl]
      properties:
        title: { type: string }
        startAt: { type: string, format: date-time }
        venue: { type: string }
        category: { type: ["string", "null"] }
        sourceUrl: { type: string, format: uri }
    MapContextItem:
      type: object
      additionalProperties: false
      required: [name, sourceUrl, objectId, latitude, longitude]
      properties:
        name: { type: string }
        sourceUrl: { type: string, format: uri }
        objectId: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    MapAttraction:
      allOf:
        - $ref: "#/components/schemas/MapContextItem"
        - type: object
          properties:
            wikipedia:
              type: object
              required: [extract, articleUrl, attribution]
              properties:
                extract: { type: string }
                articleUrl: { type: string, format: uri }
                attribution: { type: string }
    WeatherCurrent:
      type: object
      required: [temperatureC, precipitationMm, windSpeedKmh, weatherCode, time]
      properties:
        temperatureC: { type: number }
        precipitationMm: { type: number }
        windSpeedKmh: { type: number }
        weatherCode: { type: number }
        time: { type: string }
    WeatherDay:
      type: object
      required: [date, temperatureMaxC, temperatureMinC, precipitationMm, weatherCode]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        temperatureMaxC: { type: number }
        temperatureMinC: { type: number }
        precipitationMm: { type: number }
        weatherCode: { type: number }
    AssistantMessageInput:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
          maxLength: 2000
        payload:
          type: string
          minLength: 1
          maxLength: 2000
        context:
          $ref: "#/components/schemas/TripContext"
      required: [sessionId, message, context]
    TripContext:
      type: object
      properties:
        origin:
          type: [string, "null"]
        destination:
          type: [string, "null"]
        currentLocation:
          type: [string, "null"]
        stopovers:
          type: array
          items:
            type: string
        dateRange:
          type: [string, "null"]
        travellerCount:
          type: [integer, "null"]
        budget:
          type: [string, "null"]
        transportPreferences:
          type: array
          items:
            type: string
        accessibilityNeeds:
          type: array
          items:
            type: string
        sustainabilityPriority:
          type: [string, "null"]
        accommodationNeeds:
          type: array
          items:
            type: string
        activityPreferences:
          type: array
          items:
            type: string
        locationConsentMode:
          type: [string, "null"]
        reviewConfirmation:
          type: [boolean, "null"]
        handoverRequested:
          type: boolean
      required: [origin, destination, currentLocation, stopovers, dateRange, travellerCount, budget, transportPreferences, accessibilityNeeds, sustainabilityPriority, accommodationNeeds, locationConsentMode, reviewConfirmation, handoverRequested]
    AssistantMessageResponse:
      type: object
      properties:
        sessionId:
          type: string
        messages:
          type: array
          items:
            type: string
        quickReplies:
          type: array
          items:
            $ref: "#/components/schemas/AssistantQuickReply"
        context:
          $ref: "#/components/schemas/TripContext"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
          maxItems: 250
        handoverRecommendation:
          $ref: "#/components/schemas/HandoverRecommendation"
        handover:
          type: ["boolean", "null"]
        source:
          type: string
          enum: [demo, live]
        latencyMs:
          type: integer
      required: [sessionId, messages, quickReplies, context, recommendations, handoverRecommendation, handover, source, latencyMs]
    HandoverRecommendation:
      type: object
      properties:
        recommended:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [multiple_stopovers, unmet_accessibility, required_inventory_unavailable, repeated_failed_clarification, null]
        message:
          type: [string, "null"]
      required: [recommended, reason, message]
    AssistantQuickReply:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        payload:
          type: string
          minLength: 1
          maxLength: 2000
      required: [title, payload]
    Recommendation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [stay, transport, experience, offset]
        name:
          type: string
        location:
          type: string
        description:
          type: string
        price:
          type: string
        carbonKg:
          type: ["number", "null"]
        carbonLabel:
          type: ["string", "null"]
          enum: [low, moderate, high]
        certificationEvidence:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/CertificationEvidence"
        score:
          type: number
        durationMinutes:
          type: number
          minimum: 0
          description: Provider-supplied journey duration in minutes; absent when unknown. For return flight offers, sum of slice durations, not door-to-door time.
        connectionCount:
          type: integer
          minimum: 0
          description: Provider-supplied total connection count; absent when unknown.
        rankingExplanation:
          type: string
          description: Comparative weighting, known constraints and missing convenience evidence.
        certification:
          type: [string, "null"]
        source:
          type: string
        verifiedAt:
          type: string
        tags:
          type: array
          items:
            type: string
      required: [id, type, name, location, description, price, carbonKg, carbonLabel, score, certification, source, verifiedAt, tags]
    HandoverInput:
      type: object
      properties:
        sessionId: { type: string, minLength: 8, maxLength: 100 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        savedTripId:
          type: integer
          minimum: 1
        shareTranscriptConsent:
          type: boolean
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/HandoverTranscriptTurn"
          maxItems: 50
        selectedRecommendationIds:
          type: array
          items: { type: string, minLength: 1, maxLength: 160 }
          maxItems: 250
