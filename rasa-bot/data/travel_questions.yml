      - what is the carbon footprint of this journey
      - how many kilograms of CO2 for my flight
      - emissions for flying to [Costa Rica](destination)
      - flight footprint to [Bangkok](destination) from [Berlin](origin)
      - what carbon emissions would my return flight have
      - calculate carbon for a trip to [Iceland](destination)
      - how much carbon will I emit by flying
